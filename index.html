            },
            getNextTierHint: (units, isBundle = false) => {
                if (isBundle) return null;
                if (units < 6)  return { needed: 6 - units,  pct: 10 };

        /* ============================================================================
         * 2. PROCEDURAL HTML5 <CANVAS> TEXTILE MACRO-TEXTURE ENGINE
         * ============================================================================ */
        class TextileCanvasRenderer {
            static hexToRgb(hex) {
                const clean = hex.replace('#', '');
                const num = parseInt(clean, 16);
                return {
                    r: (num >> 16) & 255,
                    g: (num >> 8) & 255,
                    b: num & 255
                };
            }

            static adjustRgb({ r, g, b }, delta) {
                const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
                return `rgb(${clamp(r + delta)}, ${clamp(g + delta)}, ${clamp(b + delta)})`;
            }

            static getLuminance(hex) {
                const { r, g, b } = this.hexToRgb(hex);
                return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            }

            /**
             * Creates an offscreen seamless pattern tile for the given weave + color + scale
             */
            static createWeavePattern(ctx, weave, hex, zoom = 1) {
                const rgb = this.hexToRgb(hex);
                const tile = document.createElement('canvas');
                const tCtx = tile.getContext('2d');

                if (weave === 'waffle') {
                    const size = Math.max(10, Math.round(16 * zoom));
                    tile.width = size;
                    tile.height = size;

                    // Base thread bed
                    tCtx.fillStyle = this.adjustRgb(rgb, 0);
                    tCtx.fillRect(0, 0, size, size);

                    // Deep recessed honeycomb pocket
                    const inset = Math.max(2, Math.round(size * 0.22));
                    tCtx.fillStyle = this.adjustRgb(rgb, -34);
                    tCtx.fillRect(inset, inset, size - inset * 2, size - inset * 2);

                    // Inner shadow bevel top/left
                    tCtx.fillStyle = this.adjustRgb(rgb, -52);
                    tCtx.fillRect(inset, inset, size - inset * 2, Math.max(1, Math.round(2 * zoom)));
                    tCtx.fillRect(inset, inset, Math.max(1, Math.round(2 * zoom)), size - inset * 2);

                    // Raised ridge highlight top/left
                    tCtx.fillStyle = this.adjustRgb(rgb, 26);
                    tCtx.fillRect(0, 0, size, Math.max(1, Math.round(2.2 * zoom)));
                    tCtx.fillRect(0, 0, Math.max(1, Math.round(2.2 * zoom)), size);

                    // Subtle cross-yarn ribs on high zoom
                    if (zoom > 1.4) {
                        tCtx.strokeStyle = this.adjustRgb(rgb, 14);
                        tCtx.lineWidth = 1;
                        for (let i = 2; i < size; i += 4) {
                            tCtx.beginPath();
                            tCtx.moveTo(i, 0);
                            tCtx.lineTo(i, inset);
                            tCtx.stroke();
                        }
                    }
                } else if (weave === 'terry') {
                    const size = Math.max(12, Math.round(18 * zoom));
                    tile.width = size;
                    tile.height = size;
                    tCtx.fillStyle = this.adjustRgb(rgb, -18);
                    tCtx.fillRect(0, 0, size, size);

                    // Deterministic organic terry loops
                    const loops = [
                        [0.2, 0.25, 0.18], [0.55, 0.2, 0.2], [0.85, 0.3, 0.17],
                        [0.35, 0.6, 0.21], [0.72, 0.65, 0.19], [0.15, 0.82, 0.18],
                        [0.52, 0.88, 0.17]
                    ];
                    loops.forEach(([nx, ny, nr], idx) => {
                        const cx = nx * size;
                        const cy = ny * size;
                        const rad = Math.max(1.4, nr * size * 0.65);

                        // Loop shadow
                        tCtx.beginPath();
                        tCtx.arc(cx + 1, cy + 1.2, rad, 0, Math.PI * 2);
                        tCtx.fillStyle = this.adjustRgb(rgb, -42);
                        tCtx.fill();

                        // Loop yarn body
                        tCtx.beginPath();
                        tCtx.arc(cx, cy, rad, 0, Math.PI * 2);
                        tCtx.strokeStyle = this.adjustRgb(rgb, idx % 2 === 0 ? 24 : 12);
                        tCtx.lineWidth = Math.max(1.2, 1.8 * zoom);
                        tCtx.stroke();
                    });
                } else if (weave === 'linen') {
                    const size = Math.max(10, Math.round(14 * zoom));
                    tile.width = size;
                    tile.height = size;
                    tCtx.fillStyle = this.adjustRgb(rgb, 0);
                    tCtx.fillRect(0, 0, size, size);

                    // Diagonal twill weave + natural flax slub threads
                    tCtx.strokeStyle = this.adjustRgb(rgb, -24);
                    tCtx.lineWidth = Math.max(1, 1.4 * zoom);
                    tCtx.beginPath();
                    tCtx.moveTo(0, size);
                    tCtx.lineTo(size, 0);
                    tCtx.stroke();

                    tCtx.fillStyle = this.adjustRgb(rgb, 20);
                    for (let y = 0; y < size; y += Math.max(2, Math.round(3.5 * zoom))) {
                        tCtx.fillRect(0, y, size * 0.65, Math.max(1, zoom));
                    }
                    tCtx.fillStyle = this.adjustRgb(rgb, -16);
                    for (let x = 0; x < size; x += Math.max(2, Math.round(3.5 * zoom))) {
                        tCtx.fillRect(x, 0, Math.max(1, zoom), size * 0.65);
                    }
                } else {
                    // Pearl microfiber weave
                    const size = Math.max(8, Math.round(12 * zoom));
                    tile.width = size;
                    tile.height = size;
                    tCtx.fillStyle = this.adjustRgb(rgb, -8);
                    tCtx.fillRect(0, 0, size, size);

                    const r = Math.max(1.5, size * 0.26);
                    tCtx.fillStyle = this.adjustRgb(rgb, 18);
                    tCtx.beginPath();
                    tCtx.arc(size * 0.28, size * 0.28, r, 0, Math.PI * 2);
                    tCtx.arc(size * 0.78, size * 0.78, r, 0, Math.PI * 2);
                    tCtx.fill();

                    tCtx.fillStyle = this.adjustRgb(rgb, -30);
                    tCtx.beginPath();
                    tCtx.arc(size * 0.78, size * 0.28, r * 0.7, 0, Math.PI * 2);
                    tCtx.arc(size * 0.28, size * 0.78, r * 0.7, 0, Math.PI * 2);
                    tCtx.fill();
                }

                return ctx.createPattern(tile, 'repeat');
            }

            static roundedRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            /**
             * Renders the tactile folded textile, double-stitched border, hanging loop,
             * woven corner label, and optional interactive 2.6x macro-zoom loupe.
             */
            static render(canvas, options = {}) {
                if (!canvas) return;
                const {
                    weave = 'waffle',
                    hex = '#566F61',
                    dimensions = '70×70 cm',
                    isDishcloth = false,
                    isBundle = false,
                    loupe = null // { x, y } in CSS pixels when active
                } = options;

                const rect = canvas.getBoundingClientRect();
                const cssW = rect.width || canvas.width || 320;
                const cssH = rect.height || canvas.height || 220;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
                    canvas.width = Math.round(cssW * dpr);
                    canvas.height = Math.round(cssH * dpr);
                }

                const ctx = canvas.getContext('2d');
                ctx.save();
                ctx.scale(dpr, dpr);

                // Warm studio surface background
                const bgGrad = ctx.createLinearGradient(0, 0, cssW, cssH);
                bgGrad.addColorStop(0, '#F5F1E9');
                bgGrad.addColorStop(1, '#EAE3D6');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, cssW, cssH);

                const rgb = this.hexToRgb(hex);
                const isLightFabric = this.getLuminance(hex) > 0.68;
                const pattern = this.createWeavePattern(ctx, weave, hex, 1);

                // Geometry based on towel vs dishcloth vs bundle
                const padX = isDishcloth ? cssW * 0.20 : cssW * 0.13;
                const padY = isDishcloth ? cssH * 0.17 : cssH * 0.13;
                const mainW = cssW - padX * 2;
                const mainH = cssH - padY * 2;

                // Soft studio contact shadow
                ctx.save();
                ctx.shadowColor = 'rgba(24, 24, 27, 0.22)';
                ctx.shadowBlur = 22;
                ctx.shadowOffsetY = 10;
                this.roundedRect(ctx, padX + 4, padY + 8, mainW - 4, mainH - 4, 14);
                ctx.fillStyle = this.adjustRgb(rgb, -25);
                ctx.fill();
                ctx.restore();

                // Lower folded towel layer (creates stacked folded depth)
                this.roundedRect(ctx, padX + 6, padY + 10, mainW - 4, mainH - 2, 14);
                ctx.fillStyle = pattern;
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.14)';
                ctx.fill();

                // If bundle: draw secondary accent dishcloth stacked neatly
                if (isBundle) {
                    this.roundedRect(ctx, padX + 12, padY + 4, mainW - 16, mainH - 10, 13);
                    ctx.fillStyle = pattern;
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                    ctx.fill();
                }

                // Cotton Hanging Loop protruding subtly at top-left
                if (!isDishcloth) {
                    ctx.save();
                    this.roundedRect(ctx, padX + 22, padY - 7, 28, 13, 5);
                    ctx.fillStyle = '#EFECE6';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(24,24,27,0.18)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();
                }

                // Top Primary Textile Face
                const topH = mainH - 10;
                ctx.save();
                this.roundedRect(ctx, padX, padY, mainW - 6, topH, 14);
                ctx.fillStyle = pattern;
                ctx.fill();

                // Tactile 3D lighting gradient across cloth surface
                const sheen = ctx.createLinearGradient(padX, padY, padX + mainW, padY + topH);
                sheen.addColorStop(0, 'rgba(255,255,255,0.14)');
                sheen.addColorStop(0.5, 'rgba(255,255,255,0.0)');
                sheen.addColorStop(1, 'rgba(0,0,0,0.16)');
                ctx.fillStyle = sheen;
                ctx.fill();

                // Subtle fabric edge border
                ctx.strokeStyle = isLightFabric ? 'rgba(24,24,27,0.14)' : 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Double-Stitched Hem Detail around entire perimeter
                const hemInset = 9;
                this.roundedRect(
                    ctx,
                    padX + hemInset,
                    padY + hemInset,
                    mainW - 6 - hemInset * 2,
                    topH - hemInset * 2,
                    9
                );
                ctx.setLineDash([4, 3]);
                ctx.strokeStyle = isLightFabric ? 'rgba(24,24,27,0.28)' : 'rgba(255,255,255,0.34)';
                ctx.lineWidth = 1.15;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();

                // Woven Jacquard Corner Label ("70×70 CM • NOORDWEEF")
                const labelText = `${dimensions.toUpperCase()} • NOORDWEEF`;
                ctx.font = '700 9px "Plus Jakarta Sans", sans-serif';
                const textW = ctx.measureText(labelText).width;
                const tagW = textW + 16;
                const tagH = 20;
                const tagX = padX + mainW - 6 - tagW - 14;
                const tagY = padY + topH - tagH - 13;

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.16)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 1;
                this.roundedRect(ctx, tagX, tagY, tagW, tagH, 4);
                ctx.fillStyle = '#FAF8F5';
                ctx.fill();
                ctx.restore();

                // Stitch tacks on left/right of woven label
                ctx.strokeStyle = '#2D4A3E';
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(tagX + 3, tagY + 4);
                ctx.lineTo(tagX + 3, tagY + tagH - 4);
                ctx.moveTo(tagX + tagW - 3, tagY + 4);
                ctx.lineTo(tagX + tagW - 3, tagY + tagH - 4);
                ctx.stroke();

                ctx.fillStyle = '#18181B';
                ctx.font = '700 8.5px "Plus Jakarta Sans", sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(labelText, tagX + 8, tagY + tagH / 2 + 0.5);

                // Interactive 2.6x Macro-Zoom Loupe
                if (loupe && typeof loupe.x === 'number' && typeof loupe.y === 'number') {
                    const lx = Math.max(54, Math.min(cssW - 54, loupe.x));
                    const ly = Math.max(54, Math.min(cssH - 54, loupe.y));
                    const radius = Math.min(62, cssH * 0.30);

                    ctx.save();
                    ctx.shadowColor = 'rgba(24, 24, 27, 0.35)';
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 6;
                    ctx.beginPath();
                    ctx.arc(lx, ly, radius, 0, Math.PI * 2);
                    ctx.fillStyle = hex;
                    ctx.fill();
                    ctx.restore();

                    // Clip inside loupe & render 2.6x magnified weave
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(lx, ly, radius, 0, Math.PI * 2);
                    ctx.clip();

                    const macroPattern = this.createWeavePattern(ctx, weave, hex, 2.7);
                    ctx.translate(-lx * 1.6, -ly * 1.6);
                    ctx.fillStyle = macroPattern;
                    ctx.fillRect(lx * 1.6 - radius * 2, ly * 1.6 - radius * 2, radius * 5, radius * 5);
                    ctx.restore();

                    // Glass lens reflection + ring
                    ctx.save();
                    const glassGrad = ctx.createLinearGradient(lx - radius, ly - radius, lx + radius, ly + radius);
                    glassGrad.addColorStop(0, 'rgba(255,255,255,0.26)');
                    glassGrad.addColorStop(0.45, 'rgba(255,255,255,0.0)');
                    glassGrad.addColorStop(1, 'rgba(0,0,0,0.18)');
                    ctx.beginPath();
                    ctx.arc(lx, ly, radius, 0, Math.PI * 2);
                    ctx.fillStyle = glassGrad;
                    ctx.fill();

                    ctx.lineWidth = 3.5;
                    ctx.strokeStyle = '#FAF8F5';
                    ctx.stroke();

                    ctx.lineWidth = 1.2;
                    ctx.strokeStyle = '#2D4A3E';
                    ctx.beginPath();
                    ctx.arc(lx, ly, radius + 2, 0, Math.PI * 2);
                    ctx.stroke();

                    // Mini pill badge on bottom of loupe
                    const badgeW = 92;
                    const badgeH = 17;
                    this.roundedRect(ctx, lx - badgeW / 2, ly + radius - 12, badgeW, badgeH, 8);
                    ctx.fillStyle = '#18181B';
                    ctx.fill();
                    ctx.fillStyle = '#FAF8F5';
                    ctx.font = '700 8px "Inter", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('2.6× MACRO STOF', lx, ly + radius - 3.5);
                    ctx.restore();
                }

                ctx.restore();
            }

            /**
             * Attaches hover/touch/toggle macro-zoom loupe listeners to any canvas element
             */
            static attachInteractiveLoupe(canvas, getOptionsFn) {
                if (!canvas) return;
                canvas.classList.add('loupe-enabled');

                const renderAt = (clientX, clientY) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    this.render(canvas, { ...getOptionsFn(), loupe: { x, y } });
                };

                canvas.addEventListener('mousemove', (e) => renderAt(e.clientX, e.clientY));
                canvas.addEventListener('mouseleave', () => {
                    if (canvas.dataset.loupePinned === 'true') {
                        const rect = canvas.getBoundingClientRect();
                        this.render(canvas, { ...getOptionsFn(), loupe: { x: rect.width * 0.62, y: rect.height * 0.46 } });
                    } else {
                        this.render(canvas, { ...getOptionsFn(), loupe: null });
                    }
                });

                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches && e.touches[0]) {
                        renderAt(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });
            }
        }

        /* ============================================================================
         * 3. PERSISTENT REACTIVE CART & PRICING STORE (localStorage)
         * ============================================================================ */
        class CartStore {
            constructor() {
                this.storageKey = 'noordweef_spa_store_v2';
                this.listeners = new Set();
                this.state = {
                    vatIncl: true,
                    promoCode: '',
                    items: []
                };
                this.load();
            }

            load() {
                try {
                    const raw = localStorage.getItem(this.storageKey);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.items)) {
                            this.state = { ...this.state, ...parsed };
                            return;
                        }
                    }
                } catch (err) {
                    // Fallback gracefully if storage is restricted
                }

                // Seed 6-pack starter item on very first visit for immediate live demo
                this.state.items = [
                    {
                        id: 'NW-WAF-70__saliegroen',
                        type: 'standard',
                        sku: 'NW-WAF-70',
                        colorKey: 'saliegroen',
                        units: 6
                    }
                ];
                this.save();
            }

            save() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.state));
                } catch (err) {
                    // Ignore quota/sandbox errors
                }
            }

            subscribe(fn) {
                this.listeners.add(fn);
                return () => this.listeners.delete(fn);
            }

            notify() {
                this.save();
                this.listeners.forEach(fn => fn(this.state));
            }

            setVatIncl(vatIncl) {
                this.state.vatIncl = Boolean(vatIncl);
                this.notify();
            }

            formatMoney(amountIncl, forceIncl = null) {
                const useIncl = forceIncl !== null ? forceIncl : this.state.vatIncl;
                const val = useIncl ? amountIncl : (amountIncl / 1.21);
                return '€' + val.toFixed(2).replace('.', ',');
            }

            /**
             * Adds units of a standard SKU; automatically merges same SKU+color and upgrades volume discount
             */
            addStandardItem(sku, colorKey, unitsToAdd = 1) {
                const product = CatalogData.getBySku(sku);
                if (!product) return null;

                const id = `${sku}__${colorKey}`;
                const existing = this.state.items.find(i => i.id === id && i.type === 'standard');
                const prevUnits = existing ? existing.units : 0;
                const prevDisc = CatalogData.getDiscountForUnits(prevUnits, product.isPrebuiltBundle);

                if (existing) {
                    existing.units = Math.min(product.stock, existing.units + unitsToAdd);
                } else {
                    this.state.items.push({
                        id,
                        type: 'standard',
                        sku,
                        colorKey,
                        units: Math.min(product.stock, unitsToAdd)
                    });
                }

                const newUnits = existing ? existing.units : unitsToAdd;
                const newDisc = CatalogData.getDiscountForUnits(newUnits, product.isPrebuiltBundle);
                this.notify();

                return {
                    upgradedTier: newDisc > prevDisc ? Math.round(newDisc * 100) : null,
                    totalUnits: newUnits
                };
            }

            /**
             * Adds a custom configured Mix & Match Bundle with automatic 18% set discount
             */
            addCustomBundle({ towelSku, towelColor, towelQty, clothSku, clothColor, clothQty }) {
                const towel = CatalogData.getBySku(towelSku);
                const cloth = CatalogData.getBySku(clothSku);
                if (!towel || !cloth) return;

                const rawIncl = (towel.basePriceIncl * towelQty) + (cloth.basePriceIncl * clothQty);
                const bundleUnitPriceIncl = rawIncl * (1 - 0.18);
                const id = `MIX__${towelSku}_${towelColor}_${towelQty}__${clothSku}_${clothColor}_${clothQty}`;

                const existing = this.state.items.find(i => i.id === id);
                if (existing) {
                    existing.units += 1;
                } else {
                    this.state.items.push({
                        id,
                        type: 'custom-bundle',
                        title: `Mix & Match Set (${towelQty}× 70×70 + ${clothQty}× Vaatdoek)`,
                        subtitle: `${towelQty}× ${CatalogData.getSwatch(towelColor).name} (${towel.dimensions}) + ${clothQty}× ${CatalogData.getSwatch(clothColor).name} (${cloth.dimensions})`,
                        weave: towel.weave,
                        colorKey: towelColor,
                        unitPriceIncl: bundleUnitPriceIncl,
                        rawCompareIncl: rawIncl,
                        units: 1
                    });
                }
                this.notify();
            }

            updateItemUnits(id, delta) {
                const idx = this.state.items.findIndex(i => i.id === id);
                if (idx === -1) return;
                this.state.items[idx].units += delta;
                if (this.state.items[idx].units <= 0) {
                    this.state.items.splice(idx, 1);
                }
                this.notify();
            }

            removeItem(id) {
                this.state.items = this.state.items.filter(i => i.id !== id);
                this.notify();
            }

            clearCart() {
                this.state.items = [];
                this.state.promoCode = '';
                this.notify();
            }

            applyPromo(rawCode) {
                const code = (rawCode || '').trim().toUpperCase();
                const summary = this.getSummary();

                if (!code) {
                    this.state.promoCode = '';
                    this.notify();
                    return { ok: false, message: 'Voer een geldige kortingscode in.' };
                }

                if (code === 'WELKOM10') {
                    this.state.promoCode = 'WELKOM10';
                    this.notify();
                    return { ok: true, message: 'WELKOM10 toegepast: 10% korting op je winkelwagen!' };
                }

                if (code === 'ZAKELIJK15') {
                    if (summary.subtotalIncl < 100) {
                        return {
                            ok: false,
                            message: `ZAKELIJK15 geldt vanaf €100,00 bestelwaarde (nog €${(100 - summary.subtotalIncl).toFixed(2).replace('.', ',')} nodig).`
                        };
                    }
                    this.state.promoCode = 'ZAKELIJK15';
                    this.notify();
                    return { ok: true, message: 'ZAKELIJK15 geactiveerd: 15% zakelijke orderkorting!' };
                }

                return { ok: false, message: 'Onbekende code. Probeer WELKOM10 of ZAKELIJK15 (> €100).' };
            }

            getSummary() {
                let subtotalIncl = 0;
                let totalSavingsTierIncl = 0;
                let badgeCount = 0;

                const detailedItems = this.state.items.map(item => {
                    if (item.type === 'custom-bundle') {
                        const lineIncl = item.unitPriceIncl * item.units;
                        const savedIncl = (item.rawCompareIncl - item.unitPriceIncl) * item.units;
                        subtotalIncl += lineIncl;
                        totalSavingsTierIncl += savedIncl;
                        badgeCount += item.units;
                        return {
                            ...item,
                            discountPct: 18,
                            effectiveUnitIncl: item.unitPriceIncl,
                            lineIncl,
                            nextHint: null
                        };
                    }

                    const product = CatalogData.getBySku(item.sku);
                    if (!product) return null;

                    const disc = CatalogData.getDiscountForUnits(item.units, product.isPrebuiltBundle);
                    const effectiveUnitIncl = product.basePriceIncl * (1 - disc);
                    const lineIncl = effectiveUnitIncl * item.units;
                    const savedIncl = (product.basePriceIncl * item.units) - lineIncl;

                    subtotalIncl += lineIncl;
                    totalSavingsTierIncl += savedIncl;
                    badgeCount += item.units;

                    return {
                        ...item,
                        product,
                        title: product.name,
                        subtitle: `${CatalogData.getSwatch(item.colorKey).name} • ${product.dimensions} • ${product.gsm} g/m²`,
                        weave: product.weave,
                        discountPct: Math.round(disc * 100),
                        effectiveUnitIncl,
                        lineIncl,
                        nextHint: CatalogData.getNextTierHint(item.units, product.isPrebuiltBundle)
                    };
                }).filter(Boolean);

                // Validate ZAKELIJK15 minimum threshold dynamically
                let activeCode = this.state.promoCode;
                let promoDiscountIncl = 0;
                if (activeCode === 'WELKOM10') {
                    promoDiscountIncl = subtotalIncl * 0.10;
                } else if (activeCode === 'ZAKELIJK15') {
                    if (subtotalIncl >= 100) {
                        promoDiscountIncl = subtotalIncl * 0.15;
                    } else {
                        activeCode = '';
                    }
                }

                const afterPromoIncl = Math.max(0, subtotalIncl - promoDiscountIncl);
                const freeShippingThresholdIncl = 50;
                const shippingIncl = (afterPromoIncl === 0 || afterPromoIncl >= freeShippingThresholdIncl) ? 0 : 5.95;
                const grandTotalIncl = afterPromoIncl + shippingIncl;
                const grandTotalExcl = grandTotalIncl / 1.21;
                const vatAmount = grandTotalIncl - grandTotalExcl;

                return {
                    detailedItems,
                    badgeCount,
                    subtotalIncl,
                    subtotalExcl: subtotalIncl / 1.21,
                    totalSavingsTierIncl,
                    activeCode,
                    promoDiscountIncl,
                    afterPromoIncl,
                    freeShippingThresholdIncl,
                    shippingIncl,
                    vatAmount,
                    grandTotalIncl,
                    grandTotalExcl
                };
            }
        }

        /* ============================================================================
         * 4. LIGHTWEIGHT SPA ROUTER & NAVIGATION CONTROLLER
         * ============================================================================ */
        class Router {
            constructor(onRouteChange) {
                this.currentSection = 'top';
                this.onRouteChange = onRouteChange;
                window.addEventListener('hashchange', () => this.syncFromHash());
            }

            navigate(sectionId) {
                this.currentSection = sectionId;
                if (this.onRouteChange) this.onRouteChange(sectionId);
                const el = document.getElementById(sectionId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else if (sectionId === 'top') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            syncFromHash() {
                const hash = window.location.hash.replace('#', '');
                if (hash) this.navigate(hash);
            }
        }

            bindShellEvents() {
                document.getElementById('nav-logo-btn').addEventListener('click', () => this.router.navigate('top'));

                document.getElementById('vat-btn-incl').addEventListener('click', () => {
                    this.store.setVatIncl(true);
                    this.showToast('Prijzen worden getoond inclusief 21% BTW.');
                });

                document.getElementById('vat-btn-excl').addEventListener('click', () => {
                    this.store.setVatIncl(false);
                    this.showToast('Zakelijke weergave: alle prijzen exclusief 21% BTW.');
                });

                document.getElementById('open-cart-btn').addEventListener('click', () => this.toggleCart(true));
                document.getElementById('cart-backdrop').addEventListener('click', () => this.toggleCart(false));

                document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                    this.uiState.mobileMenuOpen = !this.uiState.mobileMenuOpen;
                    document.getElementById('mobile-nav-drawer').classList.toggle('hidden', !this.uiState.mobileMenuOpen);
                });

                // Category & section links
                this.root.querySelectorAll('.nav-cat-link').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const cat = btn.dataset.navCat || 'all';
                        this.uiState.categoryFilter = cat;
                        this.uiState.mobileMenuOpen = false;
                        document.getElementById('mobile-nav-drawer').classList.add('hidden');
                        this.renderCatalogGrid();
                        this.router.navigate('catalogus');
                    });
                });

                this.root.querySelectorAll('[data-scroll-to]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.uiState.mobileMenuOpen = false;
                        document.getElementById('mobile-nav-drawer').classList.add('hidden');
                        this.router.navigate(btn.dataset.scrollTo);
                    });
                });

                // Hero Interactive Canvas Controls
                const heroCanvas = document.getElementById('hero-textile-canvas');
                heroCanvas.dataset.loupePinned = 'true';
                TextileCanvasRenderer.attachInteractiveLoupe(heroCanvas, () => ({
                    weave: this.uiState.heroWeave,
                    hex: CatalogData.getSwatch(this.uiState.heroColor).hex,
                    dimensions: '70×70 cm'
                }));

                document.getElementById('hero-loupe-toggle').addEventListener('click', () => {
                    this.uiState.heroLoupePinned = !this.uiState.heroLoupePinned;
                    heroCanvas.dataset.loupePinned = String(this.uiState.heroLoupePinned);
                    document.getElementById('hero-loupe-btn-text').textContent =
                        `Macro-loep: ${this.uiState.heroLoupePinned ? 'Aan' : 'Uit'}`;
                    this.paintHeroCanvas();
                });

                document.getElementById('hero-weave-buttons').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-hero-weave]');
                    if (!btn) return;
                    this.uiState.heroWeave = btn.dataset.heroWeave;
                    this.syncHeroControls();
                    this.paintHeroCanvas();
                });

                document.getElementById('hero-swatch-buttons').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-hero-color]');
                    if (!btn) return;
                    this.uiState.heroColor = btn.dataset.heroColor;
                    this.syncHeroControls();
                    this.paintHeroCanvas();
                });

                // Catalog Filter Controls
                document.getElementById('cat-filter-group').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-cat]');
                    if (!btn) return;
                    this.uiState.categoryFilter = btn.dataset.cat;
                    this.renderCatalogGrid();
                });

                document.getElementById('weave-select').addEventListener('change', (e) => {
                    this.uiState.weaveFilter = e.target.value;
                    this.renderCatalogGrid();
                });

                document.getElementById('catalog-search').addEventListener('input', (e) => {
                    this.uiState.searchQuery = e.target.value;
                    this.renderCatalogGrid();
                });

                document.getElementById('catalog-sort').addEventListener('change', (e) => {
                    this.uiState.sortBy = e.target.value;
                    this.renderCatalogGrid();
                });

                // Modal backdrop close handlers
                document.getElementById('detail-modal-backdrop').addEventListener('click', (e) => {
                    if (e.target.id === 'detail-modal-backdrop') this.closeDetailModal();
                });
                document.getElementById('checkout-backdrop').addEventListener('click', (e) => {
                    if (e.target.id === 'checkout-backdrop') this.closeCheckoutModal();

            syncHeroControls() {
                const weaveObj = CatalogData.getWeave(this.uiState.heroWeave);
                const swatchObj = CatalogData.getSwatch(this.uiState.heroColor);
                document.getElementById('hero-canvas-caption').textContent = `${weaveObj.label} • ${swatchObj.name}`;

                document.querySelectorAll('.hero-weave-btn').forEach(btn => {
                    const active = btn.dataset.heroWeave === this.uiState.heroWeave;
                    btn.className = `hero-weave-btn px-2.5 py-2 rounded-xl text-xs font-semibold border transition truncate ${
                        active ? 'bg-ink-900 text-white border-ink-900' : 'bg-alabaster-50 text-ink-800 border-alabaster-200 hover:bg-alabaster-100'
                    }`;
                });

                document.querySelectorAll('.hero-swatch-btn').forEach(btn => {
                    const active = btn.dataset.heroColor === this.uiState.heroColor;

                        active ? 'ring-2 ring-offset-2 ring-ink-900 scale-110' : 'opacity-80 hover:opacity-100 hover:scale-105'

                const canvas = document.getElementById('hero-textile-canvas');
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                TextileCanvasRenderer.render(canvas, {
                    weave: this.uiState.heroWeave,
                    hex: CatalogData.getSwatch(this.uiState.heroColor).hex,
                    dimensions: '70×70 cm',
                    loupe: this.uiState.heroLoupePinned ? { x: rect.width * 0.65, y: rect.height * 0.45 } : null
                });
            }

                const incl = this.store.state.vatIncl;
                const btnIncl = document.getElementById('vat-btn-incl');
                const btnExcl = document.getElementById('vat-btn-excl');

                if (btnIncl && btnExcl) {
                    btnIncl.className = `px-2.5 py-1.5 rounded-lg transition ${incl ? 'bg-white text-ink-900 shadow-sm' : 'text-zinc-500 hover:text-ink-900'}`;
                    btnExcl.className = `px-2.5 py-1.5 rounded-lg transition ${!incl ? 'bg-ink-900 text-white shadow-sm' : 'text-zinc-500 hover:text-ink-900'}`;
                }

                const vatPill = document.getElementById('catalog-vat-pill');
                if (vatPill) {
                    vatPill.textContent = incl ? 'Alle prijzen incl. 21% BTW (Particulier)' : 'Alle prijzen excl. 21% BTW (Zakelijk / Horeca)';
                }

                const summary = this.store.getSummary();
                const badge = document.getElementById('header-cart-badge');
                if (badge) badge.textContent = summary.badgeCount;

                this.renderCatalogGrid();
                this.renderBundleConfigurator();

            /* ------------------------------------------------------------------------
             * DYNAMIC CATALOG RENDERER WITH REALTIME <CANVAS> SWATCHES
             * ------------------------------------------------------------------------ */
            renderCatalogGrid() {
                const grid = document.getElementById('catalog-grid');
                if (!grid) return;

                // Update Category Tab Highlights
                document.querySelectorAll('.cat-pill').forEach(btn => {
                    const active = btn.dataset.cat === this.uiState.categoryFilter;
                    btn.className = `cat-pill px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
                        active ? 'bg-ink-900 text-white shadow-sm' : 'bg-white text-ink-800 border border-alabaster-200 hover:bg-alabaster-100'
                    }`;
                });

                const q = this.uiState.searchQuery.trim().toLowerCase();
                let list = CatalogData.getAll().filter(p => {
                    const catOk = this.uiState.categoryFilter === 'all' || p.category === this.uiState.categoryFilter;
                    const weaveOk = this.uiState.weaveFilter === 'all' || p.weave === this.uiState.weaveFilter;
                    const searchOk = !q ||
                        p.name.toLowerCase().includes(q) ||
                        p.sku.toLowerCase().includes(q) ||
                        p.dimensions.toLowerCase().includes(q) ||
                        String(p.gsm).includes(q) ||
                        CatalogData.getWeave(p.weave).label.toLowerCase().includes(q) ||
                        p.description.toLowerCase().includes(q);
                    return catOk && weaveOk && searchOk;
                });

                list.sort((a, b) => {
                    if (this.uiState.sortBy === 'price-asc') return a.basePriceIncl - b.basePriceIncl;
                    if (this.uiState.sortBy === 'price-desc') return b.basePriceIncl - a.basePriceIncl;
                    if (this.uiState.sortBy === 'gsm-desc') return b.gsm - a.gsm;
                    return b.popularity - a.popularity;
                });

                const counter = document.getElementById('results-counter');
                if (counter) counter.textContent = `${list.length} product${list.length === 1 ? '' : 'en'}`;

                if (list.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full bg-alabaster-50 rounded-3xl p-12 text-center border border-alabaster-200">
                            <p class="font-display font-bold text-lg text-ink-900">Geen textiel gevonden voor deze filtercombinatie.</p>

                                Particulier
                            </button>
                            <button type="button" data-co-type="zakelijk" class="p-3 rounded-xl border-2 text-sm font-bold transition ${d.customerType === 'zakelijk' ? 'border-forest-600 bg-forest-50 text-forest-800' : 'border-alabaster-200 text-ink-800'}">
                                Zakelijk / Horeca (B2B)
                            </button>
                        </div>

                        ${d.customerType === 'zakelijk' || d.paymentMethod === 'factuur' ? `
                            <div class="grid sm:grid-cols-2 gap-4 bg-alabaster-50 p-4 rounded-2xl border border-alabaster-200">
                                <div>
                                    <label class="block text-xs font-semibold text-ink-900 mb-1">Bedrijfsnaam *</label>
                                    <input id="co-company" type="text" value="${d.companyName}" placeholder="Bistro Noord B.V." class="w-full px-3.5 py-2.5 rounded-xl bg-white border ${err.companyName ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                    ${err.companyName ? `<p class="text-[11px] text-red-600 mt-1">${err.companyName}</p>` : ''}
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-ink-900 mb-1">KvK-nummer (8 cijfers) *</label>
                                    <input id="co-kvk" type="text" value="${d.kvkNumber}" placeholder="84920134" class="w-full px-3.5 py-2.5 rounded-xl bg-white border ${err.kvkNumber ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                    ${err.kvkNumber ? `<p class="text-[11px] text-red-600 mt-1">${err.kvkNumber}</p>` : ''}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Address Details -->
                        <div class="grid sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-ink-900 mb-1">Volledige naam *</label>
                                <input id="co-name" type="text" value="${d.fullName}" placeholder="Sanne van der Berg" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border ${err.fullName ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                ${err.fullName ? `<p class="text-[11px] text-red-600 mt-1">${err.fullName}</p>` : ''}
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-ink-900 mb-1">E-mailadres voor factuur *</label>
                                <input id="co-email" type="email" value="${d.email}" placeholder="sanne@voorbeeld.nl" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border ${err.email ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                ${err.email ? `<p class="text-[11px] text-red-600 mt-1">${err.email}</p>` : ''}
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-semibold text-ink-900 mb-1">Postcode *</label>
                                    <input id="co-postal" type="text" value="${d.postalCode}" placeholder="1015 CJ" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border ${err.postalCode ? 'border-red-500' : 'border-alabaster-200'} text-sm uppercase">
                                    ${err.postalCode ? `<p class="text-[11px] text-red-600 mt-1">${err.postalCode}</p>` : ''}
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-ink-900 mb-1">Huisnr. *</label>
                                    <input id="co-house" type="text" value="${d.houseNumber}" placeholder="24-A" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border ${err.houseNumber ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-ink-900 mb-1">Straat & Woonplaats *</label>
                                <input id="co-city" type="text" value="${d.streetCity}" placeholder="Prinsengracht, Amsterdam" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border ${err.streetCity ? 'border-red-500' : 'border-alabaster-200'} text-sm">
                                ${err.streetCity ? `<p class="text-[11px] text-red-600 mt-1">${err.streetCity}</p>` : ''}
                            </div>
                        </div>

                        <!-- Delivery Carrier -->
                        <div>
                            <span class="block text-xs font-bold uppercase tracking-wider text-ink-900 mb-2">Bezorgmethode</span>
                            <div class="grid sm:grid-cols-2 gap-3">
                                <button type="button" data-co-carrier="postnl" class="p-3.5 rounded-xl border-2 text-left transition ${d.carrier === 'postnl' ? 'border-forest-600 bg-forest-50' : 'border-alabaster-200'}">
                                    <span class="font-bold text-sm text-ink-900 block">PostNL Pakketservice</span>
                                    <span class="text-xs text-zinc-500">Morgen in huis (${sum.shippingIncl === 0 ? 'Gratis' : '€5,95'})</span>
                                </button>
                                <button type="button" data-co-carrier="dhl-b2b" class="p-3.5 rounded-xl border-2 text-left transition ${d.carrier === 'dhl-b2b' ? 'border-forest-600 bg-forest-50' : 'border-alabaster-200'}">
                                    <span class="font-bold text-sm text-ink-900 block">DHL Zakelijk Tijdvak</span>
                                    <span class="text-xs text-zinc-500">Levering vóór 11:00 uur (+€1,50)</span>
                                </button>
                            </div>
                        </div>

                        <!-- Payment Method -->
                        <div>
                            <span class="block text-xs font-bold uppercase tracking-wider text-ink-900 mb-2">Betaalmethode</span>
                            <div class="grid sm:grid-cols-3 gap-3">
                                <button type="button" data-co-pay="ideal" class="p-3.5 rounded-xl border-2 text-left transition ${d.paymentMethod === 'ideal' ? 'border-forest-600 bg-forest-50' : 'border-alabaster-200'}">
                                    <span class="font-bold text-sm text-ink-900 block">iDEAL</span>
                                    <span class="text-xs text-zinc-500">Nederlandse banken</span>
                                </button>
                                <button type="button" data-co-pay="bancontact" class="p-3.5 rounded-xl border-2 text-left transition ${d.paymentMethod === 'bancontact' ? 'border-forest-600 bg-forest-50' : 'border-alabaster-200'}">
                                    <span class="font-bold text-sm text-ink-900 block">Bancontact</span>
                                    <span class="text-xs text-zinc-500">Direct voor België</span>
                                </button>
                                <button type="button" data-co-pay="factuur" class="p-3.5 rounded-xl border-2 text-left transition ${d.paymentMethod === 'factuur' ? 'border-forest-600 bg-forest-50' : 'border-alabaster-200'}">
                                    <span class="font-bold text-sm text-ink-900 block">Op Factuur (14 dgn)</span>
                                    <span class="text-xs text-zinc-500">Met KvK-nummer</span>
                                </button>
                            </div>

                            ${d.paymentMethod === 'ideal' ? `
                                <div class="mt-3">
                                    <label class="block text-xs font-semibold text-ink-900 mb-1">Selecteer je iDEAL-bank</label>
                                    <select id="co-ideal-bank" class="w-full px-3.5 py-2.5 rounded-xl bg-alabaster-50 border border-alabaster-200 text-sm font-medium">
                                        ${['ING', 'Rabobank', 'ABN AMRO', 'Bunq', 'ASN Bank'].map(bank => `
                                            <option value="${bank}" ${d.idealBank === bank ? 'selected' : ''}>${bank}</option>
                                        `).join('')}
                                    </select>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Final Bar -->
                        <div class="bg-alabaster-100 p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <span class="text-xs text-zinc-600 block">Totaal te voldoen (incl. 21% BTW)</span>
                                <span class="font-display font-extrabold text-2xl text-ink-900">€${finalIncl.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <button id="submit-order-btn" type="button" class="px-8 py-4 rounded-2xl bg-forest-600 hover:bg-forest-700 text-white font-semibold text-sm sm:text-base shadow-lg transition">
                                Bestelling Definitief Plaatsen
                            </button>
                        </div>
                    </div>
                `;

                this.bindCheckoutFormEvents(finalIncl, carrierExtraIncl);
            }

            syncCheckoutInputs() {
                const d = this.uiState.checkoutData;
                const val = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.value : null;
                };
                if (val('co-company') !== null) d.companyName = val('co-company');
                if (val('co-kvk') !== null) d.kvkNumber = val('co-kvk');
                if (val('co-name') !== null) d.fullName = val('co-name');
                if (val('co-email') !== null) d.email = val('co-email');
                if (val('co-postal') !== null) d.postalCode = val('co-postal');
                if (val('co-house') !== null) d.houseNumber = val('co-house');
                if (val('co-city') !== null) d.streetCity = val('co-city');
                if (val('co-ideal-bank') !== null) d.idealBank = val('co-ideal-bank');
            }

            bindCheckoutFormEvents(finalIncl, carrierExtraIncl) {
                const panel = document.getElementById('checkout-panel');
                const d = this.uiState.checkoutData;

                document.getElementById('close-co-btn').addEventListener('click', () => this.closeCheckoutModal());

                panel.querySelectorAll('[data-co-type]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.syncCheckoutInputs();
                        d.customerType = btn.dataset.coType;
                        this.renderCheckoutModal();
                    });
                });

                panel.querySelectorAll('[data-co-carrier]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.syncCheckoutInputs();
                        d.carrier = btn.dataset.coCarrier;
                        this.renderCheckoutModal();
                    });
                });

                panel.querySelectorAll('[data-co-pay]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.syncCheckoutInputs();
                        d.paymentMethod = btn.dataset.coPay;
                        if (d.paymentMethod === 'factuur') d.customerType = 'zakelijk';
                        this.renderCheckoutModal();
                    });
                });

                document.getElementById('submit-order-btn').addEventListener('click', () => {
                    this.syncCheckoutInputs();
                    const errors = {};

                    if (d.fullName.trim().length < 3) errors.fullName = 'Vul je voor- en achternaam in.';
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) errors.email = 'Vul een geldig e-mailadres in.';
                    if (d.postalCode.trim().length < 4) errors.postalCode = 'Vul een geldige postcode in.';
                    if (!d.houseNumber.trim()) errors.postalCode = 'Vul ook een huisnummer in.';
                    if (d.streetCity.trim().length < 3) errors.streetCity = 'Vul straat en woonplaats in.';

                    if (d.customerType === 'zakelijk' || d.paymentMethod === 'factuur') {
                        if (d.companyName.trim().length < 2) errors.companyName = 'Bedrijfsnaam is verplicht.';
                        if (!/^\d{8}$/.test(d.kvkNumber.replace(/\s/g, ''))) errors.kvkNumber = 'Vul een geldig KvK-nummer van 8 cijfers in.';
                    }

                    d.errors = errors;
                    if (Object.keys(errors).length > 0) {
                        this.renderCheckoutModal();
                        return;
                    }

                    const summary = this.store.getSummary();
                    const invoiceNum = 'NW-2026-' + Math.floor(10000 + Math.random() * 89999);
                    const dateStr = new Date().toLocaleDateString('nl-NL', { day: '2-digit', month: 'long', year: 'numeric' });

                    this.uiState.completedOrder = {
                        invoiceNum,
                        dateStr,
                        customer: { ...d },
                        summary,
                        carrierExtraIncl,
                        finalIncl,
                        finalExcl: finalIncl / 1.21,
                        finalVat: finalIncl - (finalIncl / 1.21)
                    };

                    this.store.clearCart();
                    this.renderCheckoutModal();
                });
            }

            renderOrderConfirmationView(panel) {
                const ord = this.uiState.completedOrder;
                const payLabel = ord.customer.paymentMethod === 'ideal'
                    ? `iDEAL (${ord.customer.idealBank})`
                    : ord.customer.paymentMethod === 'bancontact'
                        ? 'Bancontact'
                        : `Op Factuur 14 dagen (KvK: ${ord.customer.kvkNumber})`;

                panel.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                            </div>
                            <span class="text-xs font-bold uppercase tracking-widest text-forest-600">Orderbevestiging & BTW-Factuur</span>
                            <h3 class="font-display font-extrabold text-2xl sm:text-3xl text-ink-900">Bedankt voor je bestelling!</h3>
                            <p class="text-sm text-zinc-600">Factuurnummer <strong>${ord.invoiceNum}</strong> is bevestigd voor ${ord.customer.email}.</p>
                        </div>

                        <!-- Printable Invoice Sheet -->
                        <div id="printable-invoice-sheet" class="bg-alabaster-50 rounded-2xl p-5 sm:p-6 border border-alabaster-200 text-xs space-y-4">
                            <div class="flex flex-wrap justify-between gap-4 pb-4 border-b border-alabaster-200">
                                <div>
                                    <strong class="font-display text-base text-ink-900 block">NOORDWEEF® Textielatelier B.V.</strong>
                                    <span class="text-zinc-500">Textielplein 18, 7514 AN Enschede • BTW: NL864611029B01</span>
                                </div>
                                <div class="text-right">
                                    <strong class="text-ink-900 block">Factuur #${ord.invoiceNum}</strong>
                                    <span class="text-zinc-500">Datum: ${ord.dateStr}</span>
                                </div>
                            </div>

                            <div class="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <span class="text-zinc-400 uppercase font-bold text-[10px] block">Verzend- & Factuuradres</span>
                                    ${ord.customer.companyName ? `<strong class="block text-ink-900">${ord.customer.companyName} (KvK ${ord.customer.kvkNumber})</strong>` : ''}
                                    <span class="block text-ink-900 font-medium">${ord.customer.fullName}</span>
                                    <span class="block text-zinc-600">${ord.customer.streetCity} ${ord.customer.houseNumber}, ${ord.customer.postalCode}</span>
                                </div>
                                <div class="sm:text-right">
                                    <span class="text-zinc-400 uppercase font-bold text-[10px] block">Levering & Betaling</span>
                                    <span class="block text-ink-900 font-medium">${ord.customer.carrier === 'dhl-b2b' ? 'DHL Zakelijk Tijdvak' : 'PostNL Pakketservice'}</span>
                                    <span class="block text-zinc-600">${payLabel}</span>
                                </div>
                            </div>

                            <table class="w-full text-left border-t border-b border-alabaster-200">
                                <thead>
                                    <tr class="text-zinc-500 border-b border-alabaster-200">
                                        <th class="py-2">Omschrijving</th>
                                        <th class="py-2 text-center">Aantal</th>
                                        <th class="py-2 text-right">Bedrag incl. BTW</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-alabaster-200/70">
                                    ${ord.summary.detailedItems.map(i => `
                                        <tr>
                                            <td class="py-2 font-medium text-ink-900">${i.title} <span class="text-zinc-500 font-normal">(${i.subtitle})</span></td>
                                            <td class="py-2 text-center">${i.units}</td>
                                            <td class="py-2 text-right font-semibold">€${i.lineIncl.toFixed(2).replace('.', ',')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>

                            <div class="space-y-1 max-w-xs ml-auto">
                                <div class="flex justify-between text-zinc-600"><span>Totaal excl. BTW:</span><span>€${ord.finalExcl.toFixed(2).replace('.', ',')}</span></div>
                                <div class="flex justify-between text-zinc-600"><span>21% BTW:</span><span>€${ord.finalVat.toFixed(2).replace('.', ',')}</span></div>
                                <div class="flex justify-between font-display font-extrabold text-sm text-ink-900 pt-1 border-t border-alabaster-200">
                                    <span>Totaalbedrag incl. BTW:</span>
                                    <span>€${ord.finalIncl.toFixed(2).replace('.', ',')}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Actions: Download HTML Factuur / Print / Close -->
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <div class="flex flex-wrap gap-2.5">
                                <button id="download-invoice-btn" type="button" class="px-4 py-2.5 rounded-xl bg-ink-900 hover:bg-forest-700 text-white text-xs font-semibold transition">
                                    ⬇ Download Factuur (.html)
                                </button>
                                <button id="print-invoice-btn" type="button" class="px-4 py-2.5 rounded-xl bg-alabaster-100 hover:bg-alabaster-200 text-ink-900 text-xs font-semibold transition border border-alabaster-200">
                                    🖨 Factuur Afdrukken
                                </button>
                            </div>
                            <button id="done-order-btn" type="button" class="px-5 py-2.5 rounded-xl bg-forest-600 hover:bg-forest-700 text-white text-xs font-semibold transition">
                                Terug naar de Webshop
                            </button>
                        </div>
                    </div>
                `;

                document.getElementById('print-invoice-btn').addEventListener('click', () => window.print());
                document.getElementById('download-invoice-btn').addEventListener('click', () => this.downloadInvoiceFile(ord));
                document.getElementById('done-order-btn').addEventListener('click', () => this.closeCheckoutModal());
            }

            downloadInvoiceFile(ord) {
                const sheetHtml = document.getElementById('printable-invoice-sheet').innerHTML;
                const doc = `<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Factuur ${ord.invoiceNum} - NOORDWEEF</title><style>body{font-family:sans-serif;max-width:760px;margin:40px auto;padding:24px;color:#18181B;line-height:1.5}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body>${sheetHtml}</body></html>`;
                const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Factuur-${ord.invoiceNum}.html`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.showToast(`Factuur ${ord.invoiceNum}.html gedownload.`);
            }

            /* ------------------------------------------------------------------------
             * TOAST NOTIFICATIONS (NO ALERT / CONFIRM)
             * ------------------------------------------------------------------------ */
            showToast(message) {
                const stack = document.getElementById('toast-stack');
                if (!stack) return;

                const el = document.createElement('div');
                el.className = 'pointer-events-auto bg-ink-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-white/10 text-xs font-medium flex items-center gap-2.5 transition-all duration-300 opacity-0 translate-y-2';
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span><span>${message}</span>`;
                stack.appendChild(el);

                requestAnimationFrame(() => {
                    el.classList.remove('opacity-0', 'translate-y-2');
                });

                setTimeout(() => {
                    el.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => el.remove(), 300);
                }, 3200);
            }
        }

        /* ============================================================================
         * 6. BOOTSTRAP APPLICATION ON WINDOW LOAD
         * ============================================================================ */
        window.onload = function () {
            const store = new CartStore();
            const appUI = new NoordweefUI(store);
            appUI.mount();
        };
    </script>
</body>
</html>
